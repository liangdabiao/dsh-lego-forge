<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEGO set</title>
<style>
:root{--ink:#1f2124;--mute:#6b6f73;--bg1:#f6f4ef;--bg2:#e7e3da}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC",sans-serif;color:var(--ink)}
body{background:radial-gradient(120% 90% at 50% 35%,var(--bg1) 0%,var(--bg2) 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{position:fixed;left:24px;top:22px;pointer-events:none}
#title{font-size:22px;font-weight:650;letter-spacing:-.01em}
#sub{font-size:14px;color:var(--mute);margin-top:4px}
#count{font-size:12px;color:var(--mute);margin-top:10px;letter-spacing:.02em}
.dock{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:10px}
button{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:999px;padding:12px 22px;background:#1f2124;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .15s}
button:hover{transform:translateY(-1px)}button:disabled{opacity:.5;cursor:default}
.hint{position:fixed;right:22px;bottom:30px;font-size:12px;color:var(--mute)}
.still .dock,.still .hint{display:none}
#labels span{position:fixed;font-size:13px;font-weight:600;color:#6b6f73;font-family:Menlo,monospace}
.credit{position:fixed;right:22px;top:24px;font-size:11px;color:#9a9ea2}
.still .credit{display:none}
.sheet .card{display:none}
@media (max-width:600px){.card{left:16px;top:16px}#title{font-size:18px}.hint{display:none}}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--mute);font-size:14px}
/* 注意：error 层必须真的不挡事件。原来只写 display:flex，[hidden] 的 UA 规则被作者样式盖掉，
   于是「隐藏」的 #err 仍铺满全屏、吃掉 canvas 的一切 pointerdown —— 面板里的点选/框选/拖动全部失效。 */
#err:not([hidden]){display:flex}
/* 面板嵌入（?embed=1）：底部中间被面板的批注条占着，viewer 自己的 dock 要抬上去；
   右上角是嵌入工具条，credit 挪到工具条下方避免叠字；"Drag to turn" 提示由面板承担。 */
body.embed .dock{bottom:84px}
body.embed .hint{display:none}
body.embed .credit{top:54px;right:16px}
/* 审查图标签里的缩略预览（&cap=1）：viewer 自己的交互件全部让位，只留画面 */
body.embed.cap .dock,body.embed.cap .hint,body.embed.cap .credit{display:none}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="card"><div id="title"></div><div id="sub"></div><div id="count"></div></div>
<div class="dock"><button id="apart">Take apart</button><button id="rebuild" hidden>Rebuild</button></div>
<div class="hint">Drag to turn · scroll to zoom</div>
<div class="credit">Real LEGO parts · geometry from LDraw.org (CC BY 2.0)</div>
<div id="labels"></div>
<div id="err" hidden></div>
<script>
// 版本查看页：fetch 版本快照 → window.SET → 注入 viewer bundle（viewer.js 在 import 时读 window.SET，顺序必须如此）。
// 数据走 /lego-forge/api/version?name=&v=（缺 v 取最新）。embed=1 时 viewer 桥自动激活（iframe 内才生效）。
(async () => {
  const Q = new URLSearchParams(location.search);
  const name = Q.get('set') || ''; const v = Q.get('v') || '';
  const vox = Q.get('data') === 'vox';
  // 面板嵌入态：给 body 打上 embed，让下方 CSS 把 dock/credit 让开面板的批注条
  if (Q.get('embed') === '1' && window.parent !== window) document.body.classList.add('embed');
  if (Q.has('cap')) document.body.classList.add('cap');
  const err = document.getElementById('err');
  if (!name) { err.hidden = false; err.textContent = '缺少 set 参数'; return; }
  try {
    const api = vox
      ? `/lego-forge/api/vox?name=${encodeURIComponent(name)}`
      : `/lego-forge/api/version?name=${encodeURIComponent(name)}&v=${encodeURIComponent(v)}`;
    const res = await fetch(api);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    if (!data.meta) data.meta = {};
    data.meta.title = vox ? `${data.meta.title ?? name} · 设计意图（体素）` : `${data.meta.title ?? name}${v ? ` · v${v}` : ''}`;
    window.SET = data;
    const s = document.createElement('script');
    s.src = '/lego-forge/viewer.js';
    s.onerror = () => { err.hidden = false; err.textContent = 'viewer.js 加载失败'; };
    document.body.appendChild(s);
  } catch (e) {
    err.hidden = false; err.textContent = `加载失败：${e.message}（先在对话里让 agent build 一次）`;
  }
})();
</script>
</body></html>
